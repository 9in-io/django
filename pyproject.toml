[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "9in-django"
version = "0.1.0"
description = "Official Django SDK for 9in: sign-in, local users, API tokens, webhooks and your own user database."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cubelet Ltd", email = "hello@9in.io" }]
keywords = ["9in", "django", "openid-connect", "oidc", "oauth2", "sso", "single-sign-on", "jwt", "authentication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["Django>=4.2", "9in>=0.1,<0.2"]

[project.optional-dependencies]
drf = ["djangorestframework>=3.14"]

[project.urls]
Homepage = "https://9in.io"
Documentation = "https://9in.io/docs/"
Source = "https://github.com/9in-io/django"
Changelog = "https://github.com/9in-io/django/blob/main/CHANGELOG.md"
Issues = "https://github.com/9in-io/django/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nine_django"]

[tool.hatch.build.targets.sdist]
include = ["src/nine_django", "tests", "README.md", "CHANGELOG.md", "LICENSE", "docs/img/logo.png", "tox.ini"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::django.core.cache.backends.base.CacheKeyWarning"]

[tool.ruff]
target-version = "py310"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "B008", "B010"]

[tool.ruff.lint.isort]
known-first-party = ["nine_django", "tests"]
known-third-party = ["nine"]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign-in failed</title>
  <style>
    body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1a1d29; background: #f6f7fb; margin: 0; }
    main { max-width: 28rem; margin: 15vh auto; padding: 2rem; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: .5rem 0; color: #4a5068; }
    code { font-size: .85rem; color: #6b7190; }
    a.button { display: inline-block; margin-top: 1rem; padding: .5rem 1rem; border-radius: 8px; background: #2b4eff; color: #fff; text-decoration: none; }
    a.home { margin-left: 1rem; color: #4a5068; }
    @media (prefers-color-scheme: dark) {
      body { background: #11131a; color: #e8eaf2; }
      main { background: #1a1d29; box-shadow: none; }
      p { color: #b4b9cc; }
      a.home { color: #b4b9cc; }
    }
  </style>
</head>
<body>
  <main>
    <h1>We couldn't sign you in</h1>
    <p>{% if description %}{{ description }}{% else %}Something went wrong while signing you in.{% endif %}</p>
    <p><code>{{ error }}</code></p>
    <a class="button" href="{{ login_url }}">Try again</a>
    <a class="home" href="{{ home_url }}">Home</a>
  </main>
</body>
</html>

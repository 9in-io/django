# Runs the tests on every supported Django and Python version: uvx --with tox-uv tox
# The 9in Python SDK comes from NINE_SDK (a path or a pip requirement); by default, PyPI.
[tox]
requires = tox-uv>=1.11
envlist =
    py{310,311,312}-django42
    py{310,313,314}-django52
    py{312,313,314}-django60
    py{312,313,314}-django61
    py314-django61-nodrf

[testenv]
package = wheel
wheel_build_env = .pkg
passenv = NINE_TEST_DATABASE, POSTGRES_*
deps =
    {env:NINE_SDK:9in>=0.1,<0.2}
    pytest>=8
    pytest-django>=4.9
    django42: Django>=4.2,<5.0
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    !nodrf: djangorestframework>=3.15
    postgres: psycopg[binary]>=3.1
commands =
    python -m pytest {posargs:-q}
